name: Quizzler
options:
  bundleIdPrefix: com.zerodelta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "4CJ49V6QHW"
packages:
  AppDiagnostics:
    path: ../../apple_developer/diagnostics_contracts/swift
  ZeroDeltaSting:
    path: vendor/ZeroDeltaSting
targets:
  QuizzlerKit:
    type: framework
    supportedDestinations: [iOS, macCatalyst]
    deploymentTarget: "17.0"
    sources:
      - QuizzlerKit/Sources/QuizzlerKit
    dependencies:
      - package: AppDiagnostics
        product: AppDiagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.kit
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK
  QuizzleriOS:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOS
    resources:
      - QuizzleriOS/Learning/QuietPowerShellCase-v1.json
    dependencies:
      - target: QuizzlerKit
      - package: ZeroDeltaSting
    postBuildScripts:
      # The app ships no question content of its own. Packs live outside the
      # repository (question-packs/*/ is gitignored), so they cannot be static
      # project resources — they are discovered and copied here, after Copy
      # Resources and before code signing. `--require-pack` makes a build with
      # no installable questions a build failure rather than an empty app.
      # A pack reduced by scripts/pack_quarantine.py is partial: only a Debug
      # build may bundle its retained subset (--allow-partial); Release and
      # every other quality bar stay exactly as strict as before.
      - name: Bundle question packs
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          partial_args=""
          if [ "${CONFIGURATION}" = "Debug" ]; then
            partial_args="--allow-partial"
          fi
          /usr/bin/env python3 "${PROJECT_DIR}/../scripts/build_pack_assets.py" \
            --packs-root "${PROJECT_DIR}/../question-packs" \
            --destination "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
            --require-pack ${partial_args}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "40"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: QuizzleriOS/QuizzleriOS.Debug.entitlements
        EXCLUDED_SOURCE_FILE_NAMES: "*TestOnly*"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Quizzler iOS App Store (API-created)-H2C5D2K55S"
          CODE_SIGN_ENTITLEMENTS: QuizzleriOS/QuizzleriOS.Release.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: "*Fixture* *FailureInjection* *TestOnly*"
    info:
      path: QuizzleriOS/Info.plist
      properties:
        CFBundleDisplayName: Quizzler
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - remote-notification
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  QuizzlerKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzlerKit/Tests/QuizzlerKitTests
    dependencies:
      - target: QuizzlerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.kit-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
  QuizzleriOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOSTests/QuestionShellTests.swift
      - QuizzleriOSTests/ControlledProgressRepository.swift
      - QuizzleriOSTests/FixtureIsolationTests.swift
      - QuizzleriOSTests/StudyCatalogTests.swift
      - QuizzleriOSTests/CurriculumCaseTests.swift
      - QuizzleriOSTests/StudyPreferenceFixtureTests.swift
      - QuizzleriOSTests/LabProgressStoreTests.swift
      - QuizzleriOSTests/SessionCommandsTests.swift
      - QuizzleriOSTests/DiagnosticsLifecycleTests.swift
    dependencies:
      - target: QuizzleriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.tests
        GENERATE_INFOPLIST_FILE: YES
  QuizzleriOSUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOSUITests/QuizWorkflowUITests.swift
      - QuizzleriOSUITests/QuizWorkflowUITests+Helpers.swift
      - QuizzleriOSUITests/QuizWorkflowUITests+SessionResume.swift
      - QuizzleriOSUITests/AccessibilityUITests.swift
      - QuizzleriOSUITests/ColdLaunchStingUITests.swift
      - QuizzleriOSUITests/StudyPreferencesUITests.swift
      - QuizzleriOSUITests/InfoPopoverUITests.swift
      - QuizzleriOSUITests/CurriculumLabUITests.swift
      - QuizzleriOSUITests/MacCatalystUITests.swift
      - QuizzleriOSUITests/ReviewCapture.swift
      - QuizzleriOSUITests/ReviewCaptureUITests.swift
      - QuizzleriOSTests/CloudKitDevelopmentProbeTests.swift
    dependencies:
      - target: QuizzleriOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.ui-tests
        GENERATE_INFOPLIST_FILE: YES
  QuizzlerSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOSTests/QuestionRendererSnapshotTests.swift
    dependencies:
      - target: QuizzleriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.snapshot-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Quizzler:
    build:
      targets:
        QuizzleriOS: all
        QuizzlerKitTests: [test]
        QuizzleriOSTests: [test]
        QuizzleriOSUITests: [test]
        QuizzlerSnapshotTests: [test]
    test:
      testPlans:
        - path: Quizzler.xctestplan
          defaultPlan: true
      targets:
        - name: QuizzlerKitTests
        - name: QuizzleriOSTests
        - name: QuizzleriOSUITests
        - name: QuizzlerSnapshotTests
