name: Quizzler
options:
  bundleIdPrefix: com.zerodelta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "4CJ49V6QHW"
targets:
  QuizzlerKit:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzlerKit/Sources/QuizzlerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.kit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: FMWK
  QuizzleriOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOS
    dependencies:
      - target: QuizzlerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "14"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: QuizzleriOS/QuizzleriOS.Debug.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quizzler
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        EXCLUDED_SOURCE_FILE_NAMES: "*TestOnly*"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Quizzler iOS App Store (API-created)-H2C5D2K55S"
          CODE_SIGN_ENTITLEMENTS: QuizzleriOS/QuizzleriOS.Release.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: "*Fixture* *FailureInjection* *TestOnly*"
  QuizzlerKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzlerKit/Tests/QuizzlerKitTests
    dependencies:
      - target: QuizzlerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.kit-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
  QuizzleriOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOSTests/QuestionShellTests.swift
      - QuizzleriOSTests/FixtureIsolationTests.swift
    dependencies:
      - target: QuizzleriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.tests
        GENERATE_INFOPLIST_FILE: YES
  QuizzleriOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOSUITests/QuizWorkflowUITests.swift
      - QuizzleriOSUITests/AccessibilityUITests.swift
      - QuizzleriOSTests/CloudKitDevelopmentProbeTests.swift
    dependencies:
      - target: QuizzleriOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.ui-tests
        GENERATE_INFOPLIST_FILE: YES
  QuizzlerSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuizzleriOSTests/QuestionRendererSnapshotTests.swift
    dependencies:
      - target: QuizzleriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerodelta.quizzler.snapshot-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Quizzler:
    build:
      targets:
        QuizzleriOS: all
        QuizzlerKitTests: [test]
        QuizzleriOSTests: [test]
        QuizzleriOSUITests: [test]
        QuizzlerSnapshotTests: [test]
    test:
      testPlans:
        - path: Quizzler.xctestplan
          defaultPlan: true
      targets:
        - name: QuizzlerKitTests
        - name: QuizzleriOSTests
        - name: QuizzleriOSUITests
        - name: QuizzlerSnapshotTests
