# Reviewed locally on 2026-08-08. Change pins only with a fresh
# credential-free capability probe and an explicit re-pin decision.
xcode = "26.6"
xcode_build = "17F113"
xcodegen = "2.46.0"
swift_major = 6
# Runtime used by app/scripts/provision_signing.py for in-memory ES256 JWTs.
# Change only after a credential-free capability probe and explicit re-pin.
cryptography = "50.0.0"
simulator_runtime = "iOS 26.5"
simulator_device = "iPhone 16"
altool = "/Applications/Xcode.app/Contents/Developer/usr/bin/altool"
cktool = "/Applications/Xcode.app/Contents/Developer/usr/bin/cktool"
bundle_id = "com.zerodelta.quizzler"
app_store_name = "Quzzler"
team_identifier = "4CJ49V6QHW"
development_container = "iCloud.com.zerodelta.quizzler.dev"
# CloudKit Production is the Production environment of the app's one existing
# container, not a second container.
production_container = "iCloud.com.zerodelta.quizzler.dev"
schema_disposition = "same-container"
release_product_identifier = "quizzler-ios"
release_state_directory = "app/releases/state"
release_runtime_directory = "app/vendor/apple-release/runtime"
release_evidence_max_age_seconds = 86400
# INV-8 is a candidate-bound prebuild gate.  The evidence contains only
# privacy-safe hashes and public review metadata; the installed pack remains
# the source of truth for its current certification block.
release_inv8_required_packs = ["question-packs/cissp/cissp-core.json"]
release_inv8_evidence_path = "app/releases/evidence/inv8-certification.json"
# Production qualification requires one signed physical-device observation.
release_device_evidence_count = 1
release_candidate_format = "2.0.0"
release_lane = "standard"
release_prebuild_requirements = ["production-schema", "device-acceptance"]
release_readiness_requirements = ["production-schema", "device-acceptance", "asc-build", "testflight-receipt"]
signing_consumer = "quizzler-asc-provision"
# SHA-256 of app/scripts/provision_signing.py. Update only with a reviewed
# consumer-script change; the bootstrap refuses a mismatch.
signing_script_sha256 = "413220e13698be3715597b18307f3d6908e575433bcd13a473010cb90ebf69ca"
